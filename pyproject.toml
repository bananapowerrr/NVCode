[project]
name = "nvcode"
version = "0.10.0"
description = "Local-first AI coding environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["customtkinter>=5.2.0", "pystray", "pillow"]
skills = ["libcst>=1.1.0", "networkx>=3.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
nvcode = "core.dispatcher_main:main"
nvcode-ui = "ui.main_window:main"
# Temporary compatibility aliases for existing developer environments.
agentbus = "core.dispatcher_main:main"
agentbus-ui = "ui.main_window:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
