<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NVCode Protocol · Debug</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #1a1d24; --fg: #e6e8ec; --dim: #8b93a7;
      --acc: #5b9cff; --ok: #3dd68c; --bad: #f07178; --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--fg); padding: 16px;
      max-width: 1100px; margin-inline: auto;
    }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
    .badge {
      font-size: 0.75rem; padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--dim);
    }
    .badge.live { color: var(--ok); border-color: var(--ok); }
    .badge.off { color: var(--bad); border-color: var(--bad); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; min-height: 120px;
    }
    .card h2 { margin: 0 0 8px; font-size: 0.8rem; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    pre, .log {
      margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; white-space: pre-wrap; word-break: break-word;
      max-height: 280px; overflow: auto; color: var(--fg);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button, input {
      background: #252a35; color: var(--fg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
    }
    button { background: var(--acc); border: none; color: #0b1220; font-weight: 600; cursor: pointer; }
    button.secondary { background: #252a35; color: var(--fg); border: 1px solid var(--border); }
    input { flex: 1; min-width: 180px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    th { color: var(--dim); font-weight: 500; }
    .full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header>
    <h1>NVCode Protocol</h1>
    <span id="conn" class="badge off">OFFLINE</span>
    <span id="clock" class="badge">—</span>
  </header>

  <div class="row">
    <input id="msg" placeholder="New task message…" />
    <button id="btnSubmit">Submit</button>
    <button class="secondary" id="btnRefresh">Refresh</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Status</h2>
      <pre id="status">…</pre>
    </div>
    <div class="card">
      <h2>Metrics</h2>
      <pre id="metrics">…</pre>
    </div>
    <div class="card full">
      <h2>Tasks</h2>
      <div style="overflow:auto; max-height:260px">
        <table>
          <thead><tr><th>ID</th><th>Status</th><th>Channel</th><th>Message</th></tr></thead>
          <tbody id="tasks"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>Logs</h2>
      <pre id="logs" class="log">…</pre>
    </div>
    <div class="card">
      <h2>Events (SSE)</h2>
      <pre id="events" class="log"></pre>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const conn = $("conn");
const eventsEl = $("events");
let es = null;

function setLive(on) {
  conn.textContent = on ? "LIVE" : "OFFLINE";
  conn.className = "badge " + (on ? "live" : "off");
}

async function jget(path) {
  const r = await fetch(path);
  return r.json();
}

function renderTasks(data) {
  const tb = $("tasks");
  tb.innerHTML = "";
  const list = (data && data.tasks) || [];
  if (!list.length) {
    tb.innerHTML = "<tr><td colspan=4 style='color:var(--dim)'>No tasks</td></tr>";
    return;
  }
  for (const t of list.slice(0, 50)) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(t.task_id||"")}</td><td>${esc(t.status||t.folder||"")}</td><td>${esc(t.channel||"")}</td><td>${esc((t.message||"").slice(0,80))}</td>`;
    tb.appendChild(tr);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

async function refresh() {
  try {
    const [st, met, tasks, logs] = await Promise.all([
      jget("/v1/status"),
      jget("/v1/metrics"),
      jget("/v1/tasks?limit=40"),
      jget("/v1/logs/tail?n=40"),
    ]);
    $("status").textContent = JSON.stringify(st, null, 2);
    $("metrics").textContent = JSON.stringify(met.metrics || met, null, 2);
    renderTasks(tasks);
    $("logs").textContent = ((logs.lines) || []).join("\n") || "(empty)";
    $("clock").textContent = new Date().toLocaleTimeString();
    setLive(true);
  } catch (e) {
    setLive(false);
    $("status").textContent = "refresh error: " + e;
  }
}

function connectSSE() {
  if (es) try { es.close(); } catch (_) {}
  es = new EventSource("/v1/events/stream");
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (ev) => {
    const line = ev.data;
    eventsEl.textContent = (line + "\n" + eventsEl.textContent).slice(0, 8000);
  };
}

$("btnRefresh").onclick = refresh;
$("btnSubmit").onclick = async () => {
  const message = $("msg").value.trim();
  if (!message) return;
  try {
    const r = await fetch("/v1/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const d = await r.json();
    eventsEl.textContent = ("submit → " + JSON.stringify(d) + "\n" + eventsEl.textContent).slice(0, 8000);
    $("msg").value = "";
    refresh();
  } catch (e) {
    eventsEl.textContent = "submit error: " + e + "\n" + eventsEl.textContent;
  }
};

refresh();
connectSSE();
setInterval(refresh, 5000);
</script>
</body>
</html>
